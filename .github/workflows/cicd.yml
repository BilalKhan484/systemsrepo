name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: myproject
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: myproject
        run: |
          pytest

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/myproject
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t $myproject:$IMAGE_TAG \
            -t $myproject:latest \
            ./myproject

      - name: Push versioned image
        run: |
          docker push $myproject:$IMAGE_TAG

      - name: Push latest image
        run: |
          docker push $myproject:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Deploy application to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/ec2_key \
            "$EC2_USERNAME@$EC2_HOST" << EOF

            set -e

            echo "Pulling latest Docker image..."

            docker pull $DOCKERHUB_USERNAME/myproject:latest

            echo "Stopping old container..."

            docker stop myproject || true

            echo "Removing old container..."

            docker rm myproject || true

            echo "Starting new container..."

            docker run -d \
              --restart unless-stopped \
              --name myproject \
              -p 5000:5000 \
              $DOCKERHUB_USERNAME/myproject:latest

            echo "Waiting for application..."

            sleep 5

            echo "Running health check..."

            curl --fail http://localhost:5000/health

            echo ""
            echo "Deployment successful!"

          EOF